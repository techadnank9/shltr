<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheltr · 3D scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --ink:#0B1216; --panel:rgba(14,24,29,.86); --line:#22343C; --text:#E6ECEE; --muted:#8FA3AA; --amber:#F2A33A; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 40%, #13222A, var(--ink) 70%); }
  canvas { display: block; }
  .hud { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; pointer-events: none; }
  .card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; backdrop-filter: blur(8px); max-width: 520px; }
  h1 { margin: 0; font: 800 34px/0.95 "Big Shoulders Display", Impact, sans-serif; text-transform: uppercase; }
  h1 span { color: var(--amber); }
  .meta { font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 6px; }
  .credit { position: fixed; left: 16px; bottom: 14px; right: 16px; font: 11px "IBM Plex Mono", monospace; color: var(--muted); pointer-events: none; }
  #pick { margin-left: auto; }
  #pick a { display: block; color: var(--amber); font: 12px "IBM Plex Mono", monospace; text-decoration: none; padding: 2px 0; }
  #pick a.on { color: var(--text); }
  #status { font: 12px "IBM Plex Mono", monospace; color: var(--amber); margin-top: 6px; }
  .hint { font: 11px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <div class="card">
    <h1>Shel<span>tr</span> · 3D scan</h1>
    <div id="title" style="font-weight:600;margin-top:6px">Loading…</div>
    <div class="meta" id="meta"></div>
    <div id="status">Loading the 3D model…</div>
    <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <div class="card" id="pick"><div class="meta" style="margin:0 0 4px">Real reconstructions</div></div>
</div>
<div class="credit" id="credit"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const name = location.pathname.split('/').filter(Boolean).pop();
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0B1216, 0.004);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);
scene.add(new THREE.HemisphereLight(0xdfe9ef, 0x2a2016, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(3, 6, 4); scene.add(sun);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

async function list() {
  try {
    const scans = await (await fetch('/api/scans')).json();
    for (const s of scans) {
      const a = document.createElement('a'); a.href = `/scan/${s.name}`; a.textContent = (s.meta && s.meta.title) || s.name;
      if (s.name === name) a.className = 'on';
      $('pick').appendChild(a);
    }
    const me = scans.find((s) => s.name === name);
    if (me && me.meta) {
      $('title').textContent = me.meta.title || name;
      const m = me.meta, bits = [];
      if (m.images) bits.push(`${m.images} real photos`);
      if (m.vertices) bits.push(`${Number(m.vertices).toLocaleString('en-US')} points`);
      if (m.minutes) bits.push(`reconstructed in ${m.minutes} min on Vultr`);
      $('meta').textContent = bits.join(' · ');
      $('credit').textContent = [m.source, m.credit].filter(Boolean).join(' · ');
    } else {
      $('title').textContent = name;
    }
  } catch (e) { $('title').textContent = name; }
}
list();

new GLTFLoader().load(`/scans/${name}.glb`, (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) { o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);
  scene.add(root);
  const r = Math.max(size.x, size.y, size.z);
  camera.position.set(r * 0.6, r * 0.55, r * 0.9);
  camera.near = r / 1000; camera.far = r * 20; camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0); controls.maxDistance = r * 4;
  scene.fog.density = 0.6 / r;
  $('status').textContent = '';
}, (p) => { if (p.total) $('status').textContent = `Loading the 3D model… ${Math.round(100 * p.loaded / p.total)}%`; },
() => { $('status').textContent = 'This scan is not published yet.'; });

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
